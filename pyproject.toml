[project]
name = "syke"
version = "0.1.0"
description = "SYKE - a Discord bot that judges your personality from your messages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
    "emoji>=2.12",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
syke = "syke.bot:main"
syke-preview = "syke.preview:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["syke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
